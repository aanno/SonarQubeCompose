# needed for podlet convertion
name: sonarqube

services:
  sonarqube:
    # official image
    # image: docker.io/library/sonarqube:25.7.0.110598-community
    image: docker.io/mc1arke/sonarqube-with-community-branch-plugin:25.9.0.112764-community
    restart: unless-stopped
    ports:
      # SonarQube UI
      - "9000:9000"
      # JMX exporter metrics
      - "9005:9005"
    depends_on:
      - pg_sonar
    env_file:
      - .env
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - $PWD/jmx_prometheus_javaagent.jar:/opt/sonarqube/jmx_prometheus_javaagent.jar:z,ro
      - $PWD/jmx-prometheus-config.yml:/opt/sonarqube/jmx-prometheus-config.yml:z,ro
      - sonarqube_data:/opt/sonarqube/data
      # must be commended out for mc1arke/sonarqube-with-community-branch-plugin
      # until you have copied the jar /opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-*.jar
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
      - $PWD/export:/export:z
    networks:
      - sonarqube
      - pg_sonar
  pg_sonar:
    # image: postgres:17.5
    image: docker.io/library/postgres:18
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=$SONAR_JDBC_USERNAME
      - POSTGRES_PASSWORD=$SONAR_JDBC_PASSWORD
      - POSTGRES_DB=$SONAR_POSTGRES_DB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${SONAR_POSTGRES_DB} -U ${SONAR_JDBC_USERNAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_sonar:/var/lib/postgresql
      - $PWD/export:/export:z
    networks:
      - pg_sonar
  # level=WARN source=main.go:85 msg="Error loading config" err="error opening config file \"postgres_exporter.yml\": open postgres_exporter.yml: no such file or directory"
  pg_sonar_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DATA_SOURCE_NAME: "postgresql://sonar:sonarpass@postgres:5432/sonarqube?sslmode=disable"
      DATA_SOURCE_NAME: "postgresql://${SONAR_JDBC_USERNAME}:${SONAR_JDBC_PASSWORD}@${SONAR_POSTGRES_HOST}:5432/${SONAR_POSTGRES_DB}?sslmode=disable"
    networks:
      - sonarqube
      - pg_sonar
    depends_on:
      - pg_sonar
    ports:
      - "9187:9187"
  prometheus:
    # image: quay.io/prometheus/prometheus:latest
    image: quay.io/prometheus/prometheus:v3.11.3
    restart: unless-stopped
    volumes:
      - $PWD/prometheus.yml:/etc/prometheus/prometheus.yml:z,ro
      - prometheus:/prometheus
      - $PWD/export:/export:z
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      # https://prometheus.io/docs/operating/security/
      - --web.enable-admin-api
      # https://stackoverflow.com/questions/47414593/configure-prometheus-to-use-non-default-port
      - --web.listen-address=:9099
      # web context
      # - "--web.external-url=http://localhost/prometheus/"
      # - "--web.route-prefix=/prometheus"
    ports:
      # Fedora: cockpit runs on 9090 - hence standard port is discouraged
      - "9099:9099"
    networks:
      - sonarqube
      - exporter
    depends_on:
      - sonarqube
      - pg_sonar_exporter
  pushgateway:
    # image: docker.io/prom/pushgateway
    image: quay.io/prometheus/pushgateway:v1.11.2
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9091:9091"
    networks:
      - sonarqube
  grafana:
    image: docker.io/grafana/grafana-oss:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - grafana:/var/lib/grafana
      - $PWD/export:/export:z
    ports:
      # gaeko-ui runs on 3000 - hence standard port is discouraged
      # GF_SERVER_HTTP_PORT
      - "3010:3010"
    networks:
      - exporter
    depends_on:
      - prometheus
  caddy:
    image: docker.io/library/caddy:2.10
    restart: unless-stopped
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "9001:9001"
      - "9002:9002"
      - "9002:9002/udp"
    volumes:
      - $PWD/caddy:/etc/caddy:z
      # - $PWD/site:/srv:z
      - caddy_data:/data
      - caddy_config:/config
      - $PWD/export:/export:z
    networks:
      - sonarqube
      - exporter


# echo "sonarqube_data sonarqube_extensions sonarqube_logs sonarqube_temp pg_sonar_config pg_sonar_data es_sonar_data grafana prometheus caddy_data caddy_config" | xargs -n 1 podman volume create
volumes:
  sonarqube_data:
    external: true
  sonarqube_extensions:
    external: true
  sonarqube_logs:
    external: true
  sonarqube_temp:
    external: true
  pg_sonar:
    external: true
  grafana:
    external: true
  prometheus:
    external: true
  caddy_data:
    external: true
  caddy_config:
    external: true

# podman network create sonarqube
networks:
  sonarqube:
    external: true
  exporter:
    external: true
  pg_sonar:
    external: true
