services:
  sonarqube:
    image: docker.io/library/sonarqube:25.7.0.110598-community
    ports:
      # SonarQube UI
      - "9000:9000"
      # JMX exporter metrics
      - "9404:9404"
    depends_on:
      - pg_sonar
    env_file:
      - .env
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    networks:
      - sonarqube
    ports:
      - "9000:9000"
  pg_sonar:
    # image: postgres:17.5
    image: docker.io/library/postgres:18
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${SONAR_POSTGRES_DB} -U $${SONAR_POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_sonar:/var/lib/postgresql
    networks:
      - sonarqube

# echo "sonarqube_data sonarqube_extensions sonarqube_logs sonarqube_temp pg_sonar_config pg_sonar_data es_sonar_data" | xargs -n 1 podman volume create
volumes:
  sonarqube_data:
    external: true
  sonarqube_extensions:
    external: true
  sonarqube_logs:
    external: true
  sonarqube_temp:
    external: true
  pg_sonar:
    external: true

# podman network create sonarqube
networks:
  sonarqube:
    external: true
